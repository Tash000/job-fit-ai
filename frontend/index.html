<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vitralume — AI job application copilot. Suitability analysis, ATS optimizer, research matching, and truthfulness-guarded cover letters." />
    <meta name="theme-color" content="#f4f7fc" />
    <title>Vitralume — Job Application Copilot</title>
    <script>
      // Apply the saved theme + accent before first paint to avoid a flash.
      // ?theme= and ?accent= in the URL override the saved/system preference.
      try {
        var q = new URLSearchParams(window.location.search)
        var t = q.get('theme') || localStorage.getItem('vitralume-theme') || 'system'
        var a = q.get('accent') || localStorage.getItem('vitralume-accent') || 'blue'
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.accent = a === 'purple' ? 'purple' : 'blue'
      } catch (e) {}
    </script>
    <!--
      Fonts are self-hosted (public/fonts, @font-face in src/fonts.css) rather
      than loaded from fonts.googleapis.com: that stylesheet was render-blocking
      on a third-party origin and cost ~300 ms before any glyph was requested.
      Preloading the two faces used above the fold starts them during HTML parse
      instead of after the CSS has been fetched and matched.
    -->
    <link rel="preload" href="/fonts/DM-Sans-300_700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Space-Grotesk-400_700-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
