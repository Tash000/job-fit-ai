<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vitralume — AI job application copilot. Suitability analysis, ATS optimizer, research matching, and truthfulness-guarded cover letters." />
    <meta name="theme-color" content="#f6f7f9" />
    <title>Vitralume — Job Application Copilot</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // ?theme=light|dark in the URL overrides the saved/system preference.
      try {
        var q = new URLSearchParams(window.location.search).get('theme')
        var t = q === 'light' || q === 'dark' ? q : localStorage.getItem('vitralume-theme')
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
