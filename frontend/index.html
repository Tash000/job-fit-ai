<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vitralume — AI job application copilot. Suitability analysis, ATS optimizer, research matching, and truthfulness-guarded cover letters." />
    <meta name="theme-color" content="#f4f7fc" />
    <title>Vitralume — Job Application Copilot</title>
    <script>
      // Apply the saved theme + accent before first paint to avoid a flash.
      // ?theme= and ?accent= in the URL override the saved/system preference.
      try {
        var q = new URLSearchParams(window.location.search)
        var t = q.get('theme') || localStorage.getItem('vitralume-theme') || 'system'
        var a = q.get('accent') || localStorage.getItem('vitralume-accent') || 'blue'
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.accent = a === 'purple' ? 'purple' : 'blue'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
