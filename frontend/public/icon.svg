<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- macOS Squircle Rim -->
    <linearGradient id="v-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Background: Pure Deep Midnight Indigo #051230 (Sanzo Wada #232) -->
    <linearGradient id="v-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A3D"/>
      <stop offset="100%" stop-color="#040C20"/>
    </linearGradient>

    <!-- Light Facet: Gilded Starlight Gold #EEB480 -->
    <linearGradient id="v-lightFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D6"/>
      <stop offset="50%" stop-color="#FCDBC2"/>
      <stop offset="100%" stop-color="#E2A26B"/>
    </linearGradient>

    <!-- Shadow Facet: Carmine Red #CC1236 -->
    <linearGradient id="v-shadowFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0254A"/>
      <stop offset="60%" stop-color="#A8122E"/>
      <stop offset="100%" stop-color="#73081D"/>
    </linearGradient>

    <!-- Center Ridge Specular Highlight -->
    <linearGradient id="v-ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Natural Ground Contact Shadow -->
    <filter id="v-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#010610" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#010610" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#v-bg)"/>
  <rect width="512" height="512" rx="115" fill="none" stroke="url(#v-rim)" stroke-width="2.5"/>

  <!-- Pure 3D Chiseled Roman V -->
  <g filter="url(#v-shadow)">
    <!-- Right Shadow Facet (Deep Carmine Red) -->
    <path d="M 160 120 L 224 120 V 132 C 210 133, 198 138, 194 150 L 256 350 L 256 404 Z" 
          fill="url(#v-shadowFacet)"/>
    <path d="M 256 350 L 256 404 L 272 404 L 382 150 C 378 138, 386 133, 400 132 V 120 H 378 L 360 150 Z" 
          fill="url(#v-shadowFacet)"/>

    <!-- Left Illuminated Facet (Gilded Starlight Gold) -->
    <path d="M 96 120 H 160 L 256 404 H 236 L 136 150 C 132 138, 118 133, 96 132 Z" 
          fill="url(#v-lightFacet)"/>

    <!-- Hairline Stem (Front Face) -->
    <path d="M 256 350 L 360 150 C 364 138, 356 133, 342 132 V 120 H 378 L 360 150 Z" 
          fill="url(#v-lightFacet)"/>

    <!-- Razor-Sharp Center Chiseled Lapidary Ridge -->
    <line x1="160" y1="120" x2="256" y2="404" stroke="url(#v-ridge)" stroke-width="3" stroke-linecap="round"/>
    <line x1="96" y1="120" x2="160" y2="120" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  </g>
</svg>
