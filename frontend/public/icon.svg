<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Main diamond gradient (blue to violet) -->
    <linearGradient id="diamondGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B84CD;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#4E63B8;stop-opacity:0.98" />
      <stop offset="100%" style="stop-color:#9B84E0;stop-opacity:0.92" />
    </linearGradient>
    
    <!-- Left facet gradient (blue tint) -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C7ED;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4E63B8;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- Right facet gradient (violet tint) -->
    <linearGradient id="rightFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4C2F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7E6AC8;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- Highlight for glass effect -->
    <radialGradient id="highlight">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- Glow shadow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="254" fill="#F5F7FC" stroke="#D4DDF5" stroke-width="4"/>
  
  <!-- Main diamond (rombus) centered at 256,256 -->
  <path d="M 256 96 L 416 256 L 256 416 L 96 256 Z" 
        fill="url(#diamondGradient)" 
        filter="url(#glow)"/>
  
  <!-- Upper-left facet (blue) -->
  <path d="M 256 96 L 336 176 L 256 256 L 176 176 Z" 
        fill="url(#leftFacet)" 
        opacity="0.65"/>
  
  <!-- Lower-right facet (violet) -->
  <path d="M 256 256 L 336 336 L 256 416 L 176 336 Z" 
        fill="url(#rightFacet)" 
        opacity="0.65"/>
  
  <!-- Upper facet highlight (glass reflection) -->
  <path d="M 256 96 L 376 176 L 336 216 L 256 136 Z" 
        fill="url(#highlight)" 
        opacity="0.5"/>
  
  <!-- Upper-left edge highlight -->
  <path d="M 256 96 L 176 176 L 196 196 L 256 116 Z" 
        fill="url(#highlight)" 
        opacity="0.35"/>
  
  <!-- Vertical center line for depth (subtle) -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="url(#highlight)" stroke-width="3" opacity="0.35"/>
  
  <!-- Horizontal center line -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="url(#highlight)" stroke-width="3" opacity="0.25"/>
  
  <!-- Outer contour -->
  <path d="M 256 96 L 416 256 L 256 416 L 96 256 Z" 
        fill="none" 
        stroke="url(#diamondGradient)" 
        stroke-width="2" 
        opacity="0.5"/>
</svg>
