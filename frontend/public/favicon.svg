<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="fav-diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B84CD;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4E63B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B84E0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="fav-shine">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main diamond -->
  <path d="M 24 6 L 42 24 L 24 42 L 6 24 Z" 
        fill="url(#fav-diamond)"/>
  
  <!-- Left facet -->
  <path d="M 24 6 L 33 15 L 24 24 L 15 15 Z" 
        fill="url(#fav-diamond)" 
        opacity="0.7"/>
  
  <!-- Top shine -->
  <circle cx="24" cy="14" r="6" fill="url(#fav-shine)"/>
  
  <!-- Contour -->
  <path d="M 24 6 L 42 24 L 24 42 L 6 24 Z" 
        fill="none" 
        stroke="url(#fav-diamond)" 
        stroke-width="0.5" 
        opacity="0.4"/>
</svg>
